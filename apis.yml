description: >-
  Dana Incorporated (NYSE: DAN) is a global supplier of power-conveyance and energy-management
  solutions for on-highway vehicles — axles, driveshafts, transmissions, sealing and thermal
  products, and electrified propulsion including motors, inverters and controllers. Founded in
  1904 and headquartered in Maumee, Ohio, Dana completed the divestiture of its Off-Highway
  business effective January 1, 2026 and now operates sixty-six major manufacturing and assembly
  plants plus seven aftermarket sales and service facilities across 24 countries. Dana's public
  API surface was the Dana Aftermarket developer platform announced in June 2021 — eight APIs for
  advanced shipping notification, availability, deep linking, order status, part details, part
  search by application, place order and pricing. As of 2026-09-07 both that portal
  (developer.danaaftermarket.com) and its API host (api.danaaftermarket.com) return NXDOMAIN; the
  only anonymously reachable machine-readable documents Dana serves are the OpenID Connect
  discovery, OAuth authorization-server metadata and JWKS on www.dana.com, which secure the site's
  Optimizely CMS rather than a product API. This repository is an alias of the primary "dana"
  profile.

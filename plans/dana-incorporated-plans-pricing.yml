description: >-
  Dana publishes no plans, tiers, or pricing for any API. There is no pricing page, no self-service
  sign-up that names a price, and no rate card. The corporate site (dana.com) has no commercial API
  surface at all; the aftermarket ordering platform (danaaftermarket.com) is entirely behind sign-in
  and its commercial terms sit inside a Dana distributor or dealer agreement negotiated with a sales
  representative. The 2021 API launch material routed prospective users to a Dana sales
  representative rather than to a price.

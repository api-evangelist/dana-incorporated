description: >-
  Dana publishes no rate limits for any API, and no runtime rate-limit signal could be observed:
  the only live Dana API host reachable anonymously (api.dana.com, an Azure API Management gateway)
  returns a bare 404 with no RateLimit-*, X-RateLimit-* or Retry-After header, and the two hosts
  that served the Dana Aftermarket API no longer resolve.
limit_count: 0
limits: []
response_headers: []
response_headers_note: >-
  No rate-limit response headers observed. Probed api.dana.com anonymously; the gateway returns
  HTTP 404 application/json with no rate-limit headers of any family.
exhaustion_status_code: unknown
evidence:
  - url: https://api.dana.com/
    status: 404
    note: Live Azure APIM gateway; no rate-limit headers on the response.
  - url: https://www.dana.com/sitemap/
    status: 200
    note: No developer or API documentation page exists to carry published limits.
  - url: https://api.danaaftermarket.com/
    status: null
    note: NXDOMAIN.
notes: >-
  An honest zero. Limits, if any exist, are scoped inside a Dana distributor agreement and are
  not published; nothing observable supports stating a number.
